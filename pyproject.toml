[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "it-audit-mvp"
dynamic = ["version"]
description = "Локальный экспресс-аудит ИТ-зрелости компании"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "streamlit==1.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "it_audit.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
